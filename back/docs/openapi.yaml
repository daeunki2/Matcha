components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HS256 access JWT; 15 minutes; HttpOnly; SameSite=Lax; Path=/api; Secure disabled. Issued
        by login or refresh.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HS256 refresh JWT; seven days; HttpOnly; SameSite=Lax; Path=/api/auth; Secure disabled.
        Checked against the active session and rotated on refresh.
    oauthSessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Flask signed session used by Authlib to correlate OAuth redirects. Default Path=/,
        HttpOnly, Secure disabled, SameSite not explicitly configured. Obtain through a top-level provider
        login start; not a Matcha session/JWT.
    pendingOAuthCookie:
      type: apiKey
      in: cookie
      name: pending_oauth
      description: Opaque pending-signup token, 600 seconds; HttpOnly; SameSite=Lax; Path=/api/auth; Secure
        disabled. Issued by a successful new-user Google/42 callback. Required only for POST /oauth/complete;
        does not authorize /me.
