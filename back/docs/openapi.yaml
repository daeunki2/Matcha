openapi: 3.0.3
info:
  title: Matcha API
  version: 1.0.0
  description: |-
    Matcha API documentation.

    Authentication APIs are implemented. M2 APIs are proposals unless marked otherwise.

    **[Not implemented · Draft]** endpoints are unavailable. Open questions will be resolved during implementation.
servers:
- url: /
  description: Same origin as the documentation
tags:
- name: Authentication
  description: Registration, email verification and cookie-based sessions.
- name: Health
- name: M2-A · Profiles and accounts
  description: "Basic profile editing, name updates and email changes are implemented. Public profiles and completion policies remain in progress."
- name: M2-B · Interests and photos
  description: "M2 is not yet complete. Discuss tag normalization and counts, upload formats and sizes, first-photo behavior, and profile-picture deletion policies."
- name: M2-C · Location
  description: "M2 is not yet complete. Support explicit GPS consent and manual city/neighborhood input. Discuss geocoding, consent withdrawal and public location precision."
- name: M2-D · User interactions
  description: "M2 is not yet complete. Covers visits, likes, connections, blocks, reports and Fame Rating. Real-time delivery integrates with milestone M4."
paths:
  /health:
    get:
      tags:
      - Health
      summary: Check server health
      responses:
        '200':
          description: Flask server is running (does not check the database or email service).
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
              example:
                status: ok
  /api/auth/signup:
