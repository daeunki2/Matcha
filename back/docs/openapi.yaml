openapi: 3.0.3
info:
  title: Matcha API
  version: 1.0.0
  description: |-
    Current Matcha Flask API. Authentication paths and schemas are in auth.yaml. Open /docs on http://localhost:5001 or http://127.0.0.1:5001; the relative server URL keeps requests and specification loading on that same origin, so no CORS configuration is required. Keep the same hostname throughout a session.
    POST/PUT/PATCH/DELETE require an exact allowed Origin. Local Compose defaults APP_ENV=development and permits frontend origins on port 8080 and Swagger origins on port 5001. ALLOWED_ORIGINS adds comma-separated exact origins. Outside APP_ENV=development there are no built-in local origins: explicitly configure ALLOWED_ORIGINS for production. Missing/null origins are rejected. Origin is a browser-controlled header, not a Swagger editable authentication credential.
    JWT access_token and refresh_token are HttpOnly cookies, not bearer tokens returned in JSON. Execute /login with an existing verified local account, then /me, /refresh or /logout in the same browser. Swagger Authorize cannot manually set browser Cookie headers; cookie apiKey schemes describe the contract and cookies are sent automatically. OAuth start routes must be opened as top-level browser navigation, not Try it out. Successful Google/42 callbacks return 302 to FRONTEND_URL/auth/callback with status=success for existing users or status=username_required for pending signup. They retain JSON bodies and set login or pending cookies; browsers follow Location. Handled callback failures redirect to FRONTEND_URL/login?error=oauth_failed; email conflicts redirect to /login?error=account_link_required. These failures have HTML redirect bodies and do not issue new Matcha login or pending cookies. POST /oauth/complete accepts a username with the pending cookie and returns 201 JSON, not a redirect. /oauth/pending does not exist.
    See auth.yaml x-current-implementation-notes for remaining frontend-flow discrepancies. The separate Flasgger /apidocs page is not this external OpenAPI contract; use /docs.
servers:
- url: /
  description: Same origin as the documentation
tags:
- name: Authentication
  description: Registration, email verification and cookie-based sessions.
- name: Health
paths:
  /health:
    get:
      tags:
      - Health
      summary: Check server health
      responses:
        '200':
          description: Flask server is running (does not check the database or email service).
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                properties:
                  status:
                    type: string
                    enum:
                    - ok
              example:
                status: ok
  /api/auth/signup:
    $ref: ./auth.yaml#/paths/~1api~1auth~1signup
  /api/auth/verify-email:
    $ref: ./auth.yaml#/paths/~1api~1auth~1verify-email
  /api/auth/resend-verification:
    $ref: ./auth.yaml#/paths/~1api~1auth~1resend-verification
  /api/auth/login:
    $ref: ./auth.yaml#/paths/~1api~1auth~1login
  /api/auth/me:
    $ref: ./auth.yaml#/paths/~1api~1auth~1me
  /api/auth/refresh:
    $ref: ./auth.yaml#/paths/~1api~1auth~1refresh
  /api/auth/logout:
    $ref: ./auth.yaml#/paths/~1api~1auth~1logout
  /api/auth/forgot-password:
    $ref: ./auth.yaml#/paths/~1api~1auth~1forgot-password
  /api/auth/reset-password:
    $ref: ./auth.yaml#/paths/~1api~1auth~1reset-password
  /api/auth/google:
    $ref: ./auth.yaml#/paths/~1api~1auth~1google
  /api/auth/google/callback:
    $ref: ./auth.yaml#/paths/~1api~1auth~1google~1callback
  /api/auth/42:
    $ref: ./auth.yaml#/paths/~1api~1auth~142
  /api/auth/42/callback:
    $ref: ./auth.yaml#/paths/~1api~1auth~142~1callback
  /api/auth/oauth/complete:
    $ref: ./auth.yaml#/paths/~1api~1auth~1oauth~1complete
components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: access_token
      description: HS256 access JWT; 15 minutes; HttpOnly; SameSite=Lax; Path=/api; Secure disabled. Issued
        by login or refresh.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: HS256 refresh JWT; seven days; HttpOnly; SameSite=Lax; Path=/api/auth; Secure disabled.
        Checked against the active session and rotated on refresh.
    oauthSessionCookie:
      type: apiKey
      in: cookie
      name: session
      description: Flask signed session used by Authlib to correlate OAuth redirects. Default Path=/,
        HttpOnly, Secure disabled, SameSite not explicitly configured. Obtain through a top-level provider
        login start; not a Matcha session/JWT.
    pendingOAuthCookie:
      type: apiKey
      in: cookie
      name: pending_oauth
      description: Opaque pending-signup token, 600 seconds; HttpOnly; SameSite=Lax; Path=/api/auth; Secure
        disabled. Issued by a successful new-user Google/42 callback. Required only for POST /oauth/complete;
        does not authorize /me.
