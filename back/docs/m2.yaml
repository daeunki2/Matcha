paths:
  /api/users/me/profile:
    get:
      tags:
      - M2-A · Profiles and accounts
      summary: '[Partially implemented] Get my profile'
      description: |-
        **Status: Basic field retrieval implemented / M2 extensions not implemented.**

        The current response contains a profile object with user_id, gender, sexual_preference, bio and birth_date. If no profile row exists, it returns {"profile": null}.

        **Open questions / Discussion:** Decide whether to include interests/photos and a list of missing fields in this response or provide separate retrieval APIs. These fields are not currently included.

        The 200/401 responses below describe the current contract. Database errors may produce Flask errors without a shared JSON error handler.
      x-implementation-status: partial
      security:
      - accessCookie: []
      responses:
        '200':
          description: Current response containing basic profile fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    nullable: true
                    type: object
                    properties:
                      user_id:
                        type: integer
                        format: int64
                      gender:
                        type: string
                        nullable: true
                      sexual_preference:
                        type: string
                      bio:
                        type: string
                        nullable: true
                      birth_date:
                        type: string
                        format: date
                        nullable: true
                    required:
                    - user_id
                    - gender
                    - sexual_preference
                    - bio
                    - birth_date
                required:
                - profile
              examples:
                missing:
                  summary: No profile row
                  value:
                    profile: null
                existing:
                  summary: Current basic-field response
                  value:
                    profile:
                      user_id: 1
                      gender: null
                      sexual_preference: bisexual
                      bio: null
                      birth_date: null
        '401':
          description: A valid access cookie and database session are required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
    patch:
      tags:
      - M2-A · Profiles and accounts
      summary: '[Not implemented · Draft] Create or update my profile'
      description: |-
        **Status: Not implemented / Proposed contract for frontend discussion.** Request fields, response structures and status codes will be finalized during implementation. This draft does not guarantee current runtime behavior; Try it out is not a contract test.

        Proposed partial update: omitted fields remain unchanged, and the server computes profile completion. The first save also creates the profile.

        **Open questions / Discussion:** Required fields, photos, tags and location; allowed gender/preference values; biography length; minimum age; null versus empty strings; empty PATCH requests and unknown fields. A profile row alone must not imply completion.

        Write requests require an allowed Origin, as with the existing authentication endpoints.
      x-implementation-status: not-implemented
      security:
      - accessCookie: []
      responses:
        '200':
          description: Proposed success response.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    $ref: '#/components/schemas/CurrentProfile'
                  profile_completed:
                    type: boolean
        '400':
          description: Invalid input (draft).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: A valid access cookie and database session are required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission or relationship policy violation. For write requests, this also includes a disallowed
            Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error (shared JSON error handling planned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileFields'
