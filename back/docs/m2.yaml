paths:
  /api/users/me/profile:
    get:
      tags:
      - M2-A · Profiles and accounts
      summary: '[Partially implemented] Get my profile'
      description: |-
        **Status: Basic field retrieval implemented / M2 extensions not implemented.**

        The current response contains a profile object with user_id, gender, sexual_preference, bio and birth_date. If no profile row exists, it returns {"profile": null}.

        **Open questions / Discussion:** Decide whether to include interests/photos and a list of missing fields in this response or provide separate retrieval APIs. These fields are not currently included.

        The 200/401 responses below describe the current contract. Database errors may produce Flask errors without a shared JSON error handler.
      x-implementation-status: partial
      security:
      - accessCookie: []
      responses:
        '200':
          description: Current response containing basic profile fields.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    nullable: true
                    type: object
                    properties:
                      user_id:
                        type: integer
                        format: int64
                      gender:
                        type: string
                        nullable: true
                      sexual_preference:
                        type: string
                        nullable: true
                      bio:
                        type: string
                        nullable: true
                      birth_date:
                        type: string
                        format: date
                        nullable: true
                    required:
                    - user_id
                    - gender
                    - sexual_preference
                    - bio
                    - birth_date
                required:
                - profile
              examples:
                missing:
                  summary: No profile row
                  value:
                    profile: null
                existing:
                  summary: Current basic-field response
                  value:
                    profile:
                      user_id: 1
                      gender: null
                      sexual_preference: null
                      bio: null
                      birth_date: null
        '401':
          description: A valid access cookie and database session are required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
    patch:
      tags:
      - M2-A · Profiles and accounts
      summary: '[Implemented] Create or update my profile'
      description: |-
        Requires authentication and an allowed Origin. Send a non-empty JSON object containing only gender, sexual_preference, bio and/or birth_date.

        Omitted fields remain unchanged on update; null clears a field. See the request schema for allowed values and validation rules.

        Creates the profile on the first save. Both creation and updates return 200 with a profile object.
      x-implementation-status: implemented
      security:
      - accessCookie: []
      responses:
        '200':
          description: Profile created or updated. Only profile is returned.
          content:
            application/json:
              schema:
                type: object
                required:
                - profile
                properties:
                  profile:
                    $ref: '#/components/schemas/CurrentProfile'
              example:
                profile:
                  user_id: 1
                  gender: null
                  sexual_preference: null
                  bio: Hello!
                  birth_date: null
        '400':
          description: Invalid JSON, empty object, unknown fields, invalid field values or age below 18.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                invalidObject:
                  value:
                    message: Non-empty JSON object required.
                unknownFields:
                  value:
                    message: Unknown profile fields.
                gender:
                  value:
                    message: Invalid gender.
                sexualPreference:
                  value:
                    message: Invalid sexual_preference.
                bioType:
                  value:
                    message: Bio must be a string.
                bioLength:
                  value:
                    message: Bio must be 250 characters or fewer.
                birthDate:
                  value:
                    message: Invalid birth date.
                age:
                  value:
                    message: You must be at least 18 years old.
        '401':
          description: Missing or invalid access token, or no active matching user session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                authentication:
                  value:
                    message: Authentication required.
        '403':
          description: Missing, null or disallowed Origin. Global Origin validation runs before authentication and
            input validation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                origin:
                  value:
                    message: Forbidden origin.
        '500':
          description: Unhandled database or server error. A JSON error body is not guaranteed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileFields'
            examples:
              partialUpdate:
                summary: Update only the biography
                value:
                  bio: Hello!
              clearField:
                summary: Clear the birth date
                value:
                  birth_date: null
              profileFields:
                summary: Save all basic fields
                value:
                  gender: woman
                  sexual_preference: bisexual
                  bio: I enjoy hiking.
                  birth_date: '1995-06-15'
  /api/users/{id}/profile:
    get:
      tags:
      - M2-A · Profiles and accounts
      summary: '[Not implemented · Draft] Get another user''s public profile'
      description: |-
        **Status: Not implemented / Proposed contract for frontend discussion.** Request fields, response structures and status codes will be finalized during implementation. This draft does not guarantee current runtime behavior; Try it out is not a contract test.

        Exclude email, password and authentication data. Record the visit and return like/connection status. Online status and last connection time will integrate with M4.

        **Open questions / Discussion:** Blocking in both directions and the choice of 403/404; visibility of incomplete profiles; self-visits and repeat visits; exposing age instead of birth date; location precision; and the meaning of online status before M4.
      x-implementation-status: not-implemented
      security:
      - accessCookie: []
      responses:
        '200':
          description: Proposed success response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicProfile'
        '400':
          description: Invalid input (draft).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: A valid access cookie and database session are required.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Permission or relationship policy violation. For write requests, this also includes a disallowed
            Origin.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Server error (shared JSON error handling planned).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Target not found or hidden by policy (draft).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - name: id
        in: path
        required: true
        description: Target user ID. Whether self-interactions are allowed depends on the policies described for
          each operation.
        schema:
          type: integer
          format: int64
          minimum: 1
  /api/users/me:
    patch:
      tags:
      - M2-A · Profiles and accounts
      summary: '[Implemented] Update account details'
      description: Requires authentication and an allowed Origin. Update first_name and/or last_name; omitted fields
        remain unchanged. Username and email are not accepted. Returns a user object.
      x-implementation-status: implemented
      security:
      - accessCookie: []
      responses:
        '401':
          description: 'Authentication required: invalid access cookie or inactive session.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                authentication:
                  value:
                    message: Authentication required.
        '403':
          description: Missing, null or disallowed Origin. Checked before authentication.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                origin:
                  value:
                    message: Forbidden origin.
        '500':
          description: Unhandled server error. A JSON response is not guaranteed.
        '200':
          description: Account details updated.
          content:
            application/json:
              schema:
                type: object
                required:
                - user
                properties:
                  user:
                    $ref: '#/components/schemas/Account'
              example:
                user:
                  id: 1
                  username: alice
                  first_name: Alice
                  last_name: Martin
        '400':
          description: Empty or invalid JSON, unknown fields or invalid names.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                object:
                  value:
                    message: Non-empty JSON object required.
                fields:
                  value:
                    message: Unknown account fields.
                firstName:
                  value:
                    message: Invalid first_name.
                lastName:
                  value:
                    message: Invalid last_name.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountPatch'
            example:
              first_name: Alice
              last_name: Martin
  /api/users/me/email-change:
    post:
      tags:
      - M2-A · Profiles and accounts
      summary: '[Implemented] Request email change verification'
      description: |-
        Requires authentication, an allowed Origin and the current password. Available only for local accounts. The current email stays unchanged until verification.

        Sends a single-use link valid for one hour to the new address: FRONTEND_URL/verify-email-change?token=... . A successful new request invalidates previous active email-change tokens. Submit the link token to the verification endpoint.
      x-implementation-status: implemented
      security:
      - accessCookie: []
      responses:
        '401':
          description: 'Authentication required: invalid access cookie or inactive session.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                authentication:
                  value:
                    message: Authentication required.
        '403':
          description: Disallowed Origin, non-local account or incorrect current password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                origin:
                  value:
                    message: Forbidden origin.
                provider:
                  value:
                    message: Email change is not allowed.
                password:
                  value:
                    message: Incorrect current password.
        '500':
          description: Internal failure. Unhandled exceptions may return a non-JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                internal:
                  value:
                    message: Internal server error.
        '202':
          description: Verification email sent; current email unchanged.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                accepted:
                  value:
                    message: Please verify your new email address.
        '400':
          description: Invalid JSON, missing/extra fields, invalid email/password input or unchanged email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                object:
                  value:
                    message: Non-empty JSON object required.
                fields:
                  value:
                    message: New email and current password are required.
                password:
                  value:
                    message: Invalid password.
                email:
                  value:
                    message: Invalid email address.
                sameEmail:
                  value:
                    message: New email must be different.
        '409':
          description: The new email belongs to another user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                conflict:
                  value:
                    message: Email is already in use.
        '503':
          description: Email delivery failed after the new token was saved and previous active email-change tokens
            were expired.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                delivery:
                  value:
                    message: Email delivery failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - new_email
              - current_password
              additionalProperties: false
              properties:
                new_email:
                  type: string
                  maxLength: 255
                  pattern: ^[^@\s]+@[^@\s]+\.[^@\s]+$
                  description: No trimming or case normalization. Must differ from the current address and not belong
                    to another user.
                current_password:
                  type: string
                  format: password
                  minLength: 1
            example:
              new_email: alice.new@example.com
              current_password: CurrentPassword123!
  /api/users/me/email-change/verify:
    post:
      tags:
      - M2-A · Profiles and accounts
      summary: '[Implemented] Verify an email change'
      description: |-
        Requires authentication as the local account that requested the change and an allowed Origin. Send the unused token before its one-hour expiry. No password is required for this step.

        On success, updates the email, keeps the current session, revokes other sessions and invalidates active password-reset tokens. Returns JSON without redirecting or issuing new cookies.
      x-implementation-status: implemented
      security:
      - accessCookie: []
      responses:
        '401':
          description: 'Authentication required: invalid access cookie or inactive session.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                authentication:
                  value:
                    message: Authentication required.
        '403':
          description: Disallowed Origin or non-local account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                origin:
                  value:
                    message: Forbidden origin.
                provider:
                  value:
                    message: Email change is not allowed.
        '500':
          description: Internal failure or another database uniqueness conflict. Unhandled exceptions may return
            a non-JSON response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                internal:
                  value:
                    message: Internal server error.
        '200':
          description: Email updated; current session retained.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                success:
                  value:
                    message: Email updated successfully.
        '400':
          description: Invalid JSON, missing/extra fields, invalid token input or expired/used/unknown token (including
            a token for another user).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                object:
                  value:
                    message: Non-empty JSON object required.
                fields:
                  value:
                    message: Token is required.
                token:
                  value:
                    message: Invalid token.
                expired:
                  value:
                    message: Invalid or expired token.
        '409':
          description: The new email is already in use at verification time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
              examples:
                conflict:
                  value:
                    message: Email is already in use.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              additionalProperties: false
              properties:
                token:
                  type: string
                  minLength: 1
                  pattern: \S
                  description: Token from the email link. Must contain a non-whitespace character; the value is
                    looked up without trimming.
            example:
              token: token-from-email-link
