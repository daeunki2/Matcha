components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
          description: Proposed machine-readable error code. The code list will be finalized during implementation.
      required:
      - message
    Message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    ProfileFields:
      type: object
      minProperties: 1
      additionalProperties: false
      description: At least one supported field is required. Omitted fields remain unchanged on update; null clears
        a field.
      properties:
        gender:
          type: string
          nullable: true
          enum:
          - man
          - woman
          - other
          - null
          description: Exact, case-sensitive value; no trimming. Null clears the field.
        sexual_preference:
          type: string
          nullable: true
          enum:
          - heterosexual
          - homosexual
          - bisexual
          - null
          description: Exact, case-sensitive value; no trimming. Null clears the field. No default value is applied.
        bio:
          type: string
          nullable: true
          description: Leading and trailing whitespace is stripped before checking the 250-character limit. Empty
            or whitespace-only strings are stored as null. The limit applies to the trimmed value, not the raw request
            string.
        birth_date:
          type: string
          nullable: true
          example: '1995-06-15'
          description: Use YYYY-MM-DD. The implementation parses with Python date.fromisoformat, which also accepts
            supported basic and ISO week-date forms. Non-string values other than null and invalid dates return
            400. Age must be at least 18, calculated using the server current date. Null clears the date; omission
            preserves it on update.
    CurrentProfile:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        gender:
          type: string
          nullable: true
        sexual_preference:
          type: string
          nullable: true
        bio:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
      required:
      - user_id
      - gender
      - sexual_preference
      - bio
      - birth_date
    Interest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: vegan
          description: 'Database rules: lowercase, no surrounding whitespace, and no leading #. API normalization
            is undecided.'
      required:
      - id
      - name
    Photo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          description: Proposed URL for frontend display. The URL supplied instead of a storage key and the access
            policy are undecided.
        position:
          type: integer
          minimum: 1
          maximum: 5
        is_primary:
          type: boolean
      required:
      - id
      - url
      - position
      - is_primary
    Location:
      type: object
      properties:
        source:
          type: string
          enum:
          - gps
          - manual
        gps_consent:
          type: boolean
        label:
          type: string
          description: Display name of the city or neighborhood.
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required:
      - source
      - gps_consent
      - label
    Relationship:
      type: object
      properties:
        liked_by_me:
          type: boolean
        likes_me:
          type: boolean
        connected:
          type: boolean
        can_like:
          type: boolean
        can_chat:
          type: boolean
      required:
      - liked_by_me
      - likes_me
      - connected
      - can_like
      - can_chat
    PublicUserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        age:
          type: integer
        primary_photo:
          nullable: true
          type: object
          properties:
            id:
              type: integer
              format: int64
            url:
