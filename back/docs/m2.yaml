components:
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        code:
          type: string
          description: Proposed machine-readable error code. The code list will be finalized during implementation.
      required:
      - message
    Message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    ProfileFields:
      type: object
      properties:
        gender:
          type: string
          description: Allowed values and display labels are undecided. Arbitrary strings have not been approved.
        sexual_preference:
          type: string
          description: Defaults to bisexual when unspecified. Allowed values and the gender/preference model require
            discussion.
          example: bisexual
        bio:
          type: string
          description: Length limit undecided.
        birth_date:
          type: string
          format: date
          description: Birth date for age calculation. Minimum age and edit policy are undecided.
    CurrentProfile:
      type: object
      properties:
        user_id:
          type: integer
          format: int64
        gender:
          type: string
          nullable: true
        sexual_preference:
          type: string
        bio:
          type: string
          nullable: true
        birth_date:
          type: string
          format: date
          nullable: true
      required:
      - user_id
      - gender
      - sexual_preference
      - bio
      - birth_date
    Interest:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          example: vegan
          description: 'Database rules: lowercase, no surrounding whitespace, and no leading #. API normalization
            is undecided.'
      required:
      - id
      - name
    Photo:
      type: object
      properties:
        id:
          type: integer
          format: int64
        url:
          type: string
          description: Proposed URL for frontend display. The URL supplied instead of a storage key and the access
            policy are undecided.
        position:
          type: integer
          minimum: 1
          maximum: 5
        is_primary:
          type: boolean
      required:
      - id
      - url
      - position
      - is_primary
    Location:
      type: object
      properties:
        source:
          type: string
          enum:
          - gps
          - manual
        gps_consent:
          type: boolean
        label:
          type: string
          description: Display name of the city or neighborhood.
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required:
      - source
      - gps_consent
      - label
    Relationship:
      type: object
      properties:
        liked_by_me:
          type: boolean
        likes_me:
          type: boolean
        connected:
          type: boolean
        can_like:
          type: boolean
        can_chat:
          type: boolean
      required:
      - liked_by_me
      - likes_me
      - connected
      - can_like
      - can_chat
    PublicUserSummary:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
        age:
          type: integer
        primary_photo:
          nullable: true
          type: object
          properties:
            id:
              type: integer
              format: int64
            url:
              type: string
              description: Proposed URL for frontend display. The URL supplied instead of a storage key and the
                access policy are undecided.
            position:
              type: integer
              minimum: 1
              maximum: 5
            is_primary:
              type: boolean
          required:
          - id
          - url
          - position
          - is_primary
        fame_rating:
          type: number
          description: Formula, range and update timing are undecided.
        location_label:
          type: string
    AccountPatch:
      type: object
      properties:
        username:
          type: string
          maxLength: 50
        first_name:
          type: string
          maxLength: 100
        last_name:
          type: string
          maxLength: 100
    Account:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        first_name:
          type: string
          nullable: true
        last_name:
          type: string
          nullable: true
    PublicProfile:
      allOf:
      - $ref: '#/components/schemas/PublicUserSummary'
      - type: object
        properties:
          gender:
            type: string
          sexual_preference:
            type: string
          bio:
            type: string
          interests:
            type: array
            items:
              $ref: '#/components/schemas/Interest'
          photos:
            type: array
            items:
              $ref: '#/components/schemas/Photo'
          is_online:
            type: boolean
          last_seen_at:
            type: string
            format: date-time
            nullable: true
          relationship:
            $ref: '#/components/schemas/Relationship'
    InterestList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Interest'
        next_cursor:
          type: string
          nullable: true
          description: Cursor pagination is proposed. Sorting, duplicate handling and maximum limit are undecided.
      required:
      - items
      - next_cursor
    ReceivedLikeList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              user:
                $ref: '#/components/schemas/PublicUserSummary'
              liked_at:
                type: string
                format: date-time
        next_cursor:
          type: string
          nullable: true
          description: Cursor pagination is proposed. Sorting, duplicate handling and maximum limit are undecided.
      required:
      - items
      - next_cursor
    VisitorList:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              user:
                $ref: '#/components/schemas/PublicUserSummary'
              visited_at:
                type: string
                format: date-time
        next_cursor:
          type: string
          nullable: true
          description: Cursor pagination is proposed. Sorting, duplicate handling and maximum limit are undecided.
      required:
      - items
      - next_cursor
