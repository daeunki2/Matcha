<app-auth-layout
  [title]="'Reset Password'"
  [subtitle]="'Enter your email address and we will send you a link to reset your password.'"
>
  @if (status() === 'success') {
    <p>If an account exists for this email, you will receive a password reset link.</p>
  } @else {
  <form (submit)="onSubmit($event)">
    <label class="auth-label" for="email">Email</label>
    <input
    id="email"
    class="auth-input"
    [class.invalid]="emailErrors().length > 0"
    type="email"
    [formField]="form.email"
    autocomplete="email"
    />
    @for (error of emailErrors(); track error) {
      <p class="form-error">{{ error.message }}</p>
    }
    @if (errorMessage()) {
      <p class="form-error" role="alert">{{ errorMessage() }}</p>
    }
    <button class="matcha-button" type="submit" [disabled]="status() === 'sending'">
      {{ status() === 'sending' ? 'Sending...' : 'Send Recovery Link' }}
    </button>
  </form>
  }
  <a class="auth-link text-sm text-ct" href="/login">Back to Login</a>
</app-auth-layout>
