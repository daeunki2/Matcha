<app-auth-layout
  [title]="'SignUp'"
  [subtitle]="'Welcome! Please sign up for your account.'"
>

<form [formGroup]="form" (ngSubmit)="onSubmit()">
<label for="firstName">First Name</label>
<input class="signup-input" type="text" formControlName="firstname" />
<label for="lastName">Last Name</label>
<input class="signup-input" type="text" formControlName="lastname" />
<label for="username">Username</label>
  <input
  class="signup-input"
	type="text"
	formControlName="username"
  />
<label for="email">Email</label>
  <input
  class="signup-input"
	type="email"
	formControlName="email"
  />
<label for="password">Password</label>
  <input
  class="signup-input"
	type="password"
	formControlName="password"
  />
  <button matButton class="signup-button" type="submit">Sign Up</button>
</form>
  <a class="matcha-link" href="/login">Already have an account? Login</a>
</app-auth-layout>
