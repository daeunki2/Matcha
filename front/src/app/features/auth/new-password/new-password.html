<app-auth-layout [title]="'Reset Password'"
	[subtitle]="'Enter your new password'">
	<form (submit)="resetPassword($event)">
		<label class="auth-label" for="email">Password</label>
		<input class="auth-input" [class.invalid]="passwordErrors().length > 0" type="password" [formField]="form.password"
			autocomplete="password" />
		@for (error of passwordErrors(); track error) {
		<p class="form-error">{{ error.message }}</p>
		}
		<button class="matcha-button" type="submit">Set new password</button>
	</form>
	<a class="auth-link text-sm text-ct" href="/login">Back to Login</a>
</app-auth-layout>
