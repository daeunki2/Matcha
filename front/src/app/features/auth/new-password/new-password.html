<app-auth-layout [title]="'Reset Password'"
	[subtitle]="'Enter your new password'">
	@if (status() === 'success') {
		<p>Your password has been reset successfully.</p>
		<a class="auth-link text-ct" href="/login">Continue to Login</a>
	} @else {
	<form (submit)="resetPassword($event)">
		<label class="auth-label" for="password">Password</label>
		<input id="password" class="auth-input" [class.invalid]="passwordErrors().length > 0" type="password" [formField]="form.password"
			autocomplete="new-password" />
		@for (error of passwordErrors(); track error) {
		<p class="form-error">{{ error.message }}</p>
		}
		@if (errorMessage()) {
			<p class="form-error" role="alert">{{ errorMessage() }}</p>
		}
		<button class="matcha-button" type="submit" [disabled]="isSubmitting()">
			{{ isSubmitting() ? 'Saving...' : 'Set new password' }}
		</button>
	</form>
	}
	<a class="auth-link text-sm text-ct" href="/login">Back to Login</a>
</app-auth-layout>
